services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: settle
      POSTGRES_PASSWORD: settle
      POSTGRES_DB: settle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settle -d settle"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  clamav:
    image: clamav/clamav:1.4.3
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "4000:4000"

  worker:
    build: .
    command: ["node", "dist/src/workers/index.js"]
    env_file:
      - .env
    environment:
      CLAMAV_HOST: clamav
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  postgres_data:
